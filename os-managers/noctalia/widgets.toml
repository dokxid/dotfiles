[bar.main]
start = ["workspaces", "gap", "taskbar"]
icon_color = "on_surface"
center = ["clock"]
end = [
  "group:middle",
  "gap",
  "group:systray",
  "gap",
  "group:tray",
  "clipboard",
  "notifications",
]

[[bar.main.capsule_group]]
members = ["date", "gap2x", "weather"]
id = "middle"
fill = "on_primary"
foreground = "primary"
padding = 24.0
enabled = true

[[bar.main.capsule_group]]
id = "systray"
members = ["network", "bluetooth", "volume"]
fill = "on_primary"
foreground = "primary"
padding = 16.0
enabled = true

[[bar.main.capsule_group]]
id = "tray"
members = ["tray-button", "tray"]
accordion = true
widget_spacing = 10
padding = 12
fill = "primary"
foreground = "on_primary"
accordion_direction = "end"

[widget.gap]
type = "spacer"
length = 12

[widget.gap2x]
type = "spacer"
length = 24

[widget.taskbar]
group_by_workspace = true
fill = "primary"
capsule_foreground = "on_primary"
show_all_outputs = false
only_active_workspace = false
show_workspace_label = true
scale = 1.5
workspace_label_placement = "inside"
hide_empty_workspaces = true
workspace_group_capsule = true
group_single_icon_per_app = false
show_active_indicator = true
focused_color = "primary"
occupied_color = "primary"
empty_color = "primary"
active_opacity = 1.0
inactive_opacity = 0.6
focused_output_only = true

[widget.workspaces]
display = "name"  # none | id | name
style = "regular"
max_label_chars = 8  # truncate long workspace names (e.g. "VESKTOP" → "VE")
labels_only_when_occupied = false  # (1) (2*) ( ) (4) - occupied tags and the active tag show labels (*active but empty)
scale = 1.2
hide_when_empty = false
pill_scale = 2.0
active_pill_size = 2.5
inactive_pill_size = 1.0
focused_color = "primary"
occupied_color = "primary"
empty_color = "surface_variant"
focused_output_only = true  # true = only the focused monitor highlights its active workspace

[widget.volume]
show_label = false

[widget.network]
show_label = false

[widget.tray-button]
type = "custom_button"
capsule = true
capsule_fill = "primary"
scale = 1.3
glyph = "layout-sidebar-right-expand"

[widget.tray]
capsule = true
scale = 1.3
icon_color = "primary"
padding = 16.0
hidden = [
  "nm-applet",
  "blueman",
  "org.kde.StatusNotifierItem-1-1",
  "tailscale",
  "keepassxc",
]

[widget.clock]
scale = 1.2
format = "{:%H:%M}"
capsule_fill = "primary"
capsule_foreground = "on_primary"
capsule = true
capsule_padding = 16

[widget.weekday]
type = "clock"
scale = 1.2
format = "KW {:%W - %a}\n{:%d.%m.%Y}"

[widget.date]
type = "clock"
scale = 1.3
format = "KW {:%W - %a}\n{:%d.%m.%Y}"

[widget.weather]
scale = 0.9
max_length = 180
show_condition = false
show_temperature = true

[widget.clipboard]
capsule = true
capsule_padding = 12
scale = 1.3
capsule_fill = "primary"
icon_color = "on_primary"
capsule_foreground = "on_primary"

[widget.notifications]
capsule = true
scale = 1.3
capsule_padding = 12
capsule_fill = "primary"
icon_color = "on_primary"
capsule_foreground = "on_primary"
